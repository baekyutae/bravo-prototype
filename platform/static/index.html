<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bravo Exit Console</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #f4f5f3; --surface: #fcfcfb; --surface-2: #f0f1ee; --line: #e2e4df; --line-strong: #c9ccc4;
  --ink: #1c1d1a; --ink-2: #4a4c46; --muted: #7b7e75;
  --accent: #3b5bdb; --accent-soft: #e7ecfd; --ai: #7048e8; --ai-soft: #f0ebfe;
  --good: #0ca30c; --good-ink: #0a7a0a; --warning: #fab219; --warning-ink: #8a5a00;
  --serious: #ec835a; --critical: #d03b3b; --critical-ink: #b42f2f;
  --sim: #8a7a5a; --sim-soft: #f3efe6;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px rgb(0 0 0 / .04);
  --radius: 12px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2e2e2b; --line-strong: #44443f;
    --ink: #ecece8; --ink-2: #bdbdb6; --muted: #8b8b84;
    --accent: #7c95f5; --accent-soft: #1f2640; --ai: #a58bfa; --ai-soft: #2a2140;
    --good-ink: #4fc94f; --warning-ink: #fab219; --critical-ink: #f07373;
    --sim: #c4b28a; --sim-soft: #2a2620;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 Pretendard, system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
       -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.spacer { flex: 1; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
       padding: 10px 24px; background: color-mix(in srgb, var(--surface) 88%, transparent);
       backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--ai)); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px;
        border: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
       cursor: pointer; font-weight: 600; font-size: 13px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; font-weight: 500; }
.btn.danger { color: var(--critical-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.busy { pointer-events: none; opacity: .6; }
.btn.busy::after { content: " …"; }

/* ---------- layout ---------- */
.page { max-width: 1440px; margin: 0 auto; padding: 20px 24px 40px; display: grid; gap: 16px;
        grid-template-columns: minmax(0, 1fr) 360px; }
.full { grid-column: 1 / -1; }
@media (max-width: 1100px) { .page { grid-template-columns: 1fr; padding: 16px; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
.card-h h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: -.005em; }
.card-b { padding: 14px 18px 18px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 5px;
         font-size: 11px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
.b-good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-ink); }
.b-crit { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical-ink); }
.b-warn { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--warning-ink); }
.b-ai { background: var(--ai-soft); color: var(--ai); }
.b-sim { background: var(--sim-soft); color: var(--sim); }
.b-local { background: color-mix(in srgb, var(--serious) 16%, transparent); color: var(--serious); }
.b-neutral { background: var(--surface-2); color: var(--ink-2); }

/* ---------- topology ---------- */
.topo { width: 100%; height: auto; display: block; }
.topo text { font-family: inherit; fill: var(--ink); }
.topo .zone { fill: var(--surface-2); stroke: var(--line); }
.topo .zone-label { font-size: 13px; font-weight: 700; }
.topo .zone-sub { font-size: 11px; fill: var(--muted); }
.topo .node { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.topo .node.active { stroke: var(--accent); stroke-width: 2; }
.topo .node.alert { stroke: var(--critical); stroke-width: 2; }
.topo .n-title { font-size: 13px; font-weight: 700; }
.topo .n-sub { font-size: 11px; fill: var(--muted); }
.topo .n-val { font-size: 12px; font-family: var(--mono); fill: var(--ink-2); }
.topo .edge { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.topo .edge.on { stroke: var(--accent); stroke-width: 2.5; }
.topo .edge.flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
.topo .edge.repl { stroke: var(--ai); stroke-width: 2; }
.topo .edge.off { stroke-dasharray: 3 5; opacity: .6; }
.topo .tag { font-size: 11px; font-weight: 700; }
@keyframes flow { to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) { .topo .edge.flow { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 0 18px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 6px; }

/* ---------- pipeline ---------- */
.pipe { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.phase { flex: 1 0 auto; border-radius: 10px; padding: 8px 10px 10px; border: 1px dashed var(--line-strong); }
.phase.ai { background: color-mix(in srgb, var(--ai-soft) 60%, transparent); border-color: color-mix(in srgb, var(--ai) 35%, transparent); }
.phase.human { background: color-mix(in srgb, var(--warning) 8%, transparent); border-color: color-mix(in srgb, var(--warning) 45%, transparent); }
.phase.code { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.phase-h { font-size: 11px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px; }
.steps { display: flex; gap: 6px; }
.step { display: flex; flex-direction: column; gap: 2px; min-width: 92px; padding: 8px 10px; border-radius: 8px;
        background: var(--surface); border: 1px solid var(--line); }
.step b { font-size: 11px; font-family: var(--mono); letter-spacing: .02em; color: var(--muted); font-weight: 600; }
.step span { font-size: 12px; color: var(--ink-2); }
.step.done b::before { content: "✓ "; color: var(--good-ink); }
.step.done b { color: var(--ink-2); }
.step.now { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step.now b { color: var(--accent); }
.exc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; font-size: 12px; color: var(--muted); }
.exc .step { min-width: 0; flex-direction: row; gap: 6px; padding: 4px 9px; }
.exc .step.now { border-color: var(--critical); box-shadow: 0 0 0 3px color-mix(in srgb, var(--critical) 15%, transparent); }
.exc .step.now b { color: var(--critical-ink); }

/* ---------- next action ---------- */
.next { display: flex; gap: 18px; align-items: center; padding: 18px; }
.next-ico { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
            background: var(--accent-soft); color: var(--accent); font-size: 20px; font-weight: 700; }
.next-ico.ai { background: var(--ai-soft); color: var(--ai); }
.next-ico.human { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning-ink); }
.next-ico.stop { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical-ink); }
.next-k { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.next-t { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.next-d { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.next .btn { flex: none; height: 40px; padding: 0 18px; }
@media (max-width: 640px) { .next { flex-wrap: wrap; } }
details.more { border-top: 1px solid var(--line); }
details.more summary { cursor: pointer; padding: 10px 18px; font-size: 12px; color: var(--muted); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }
.more-b { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 14px; }
.more-b .sep { width: 100%; font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 12px 10px; border: 0; background: none; cursor: pointer; font-size: 13px; color: var(--muted);
       border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 600; }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.tab .badge { margin-left: 4px; }
.panel { padding: 16px 18px 18px; min-height: 220px; overflow-x: auto; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.verdict-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.verdict-big { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.sec { font-size: 11px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; letter-spacing: .02em; display: flex; gap: 6px; align-items: center; }
.sec:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.attempt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.attempt-h { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.chain .arrow { color: var(--muted); }
.reason { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.evidence { color: var(--muted); font-size: 11px; margin-top: 3px; font-family: var(--mono); }
ul.clean { margin: 4px 0 0; padding-left: 18px; }
ul.clean li { margin: 2px 0; }
.bind { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .two { grid-template-columns: 1fr; } }

/* ---------- live load ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.tile .l { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 20px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.spark-wrap { position: relative; margin-top: 14px; }
.spark { width: 100%; height: 56px; display: block; cursor: crosshair; }
.spark-tip { position: absolute; top: -4px; transform: translate(-50%, -100%); background: var(--ink); color: var(--surface);
             font-size: 11px; padding: 3px 7px; border-radius: 5px; pointer-events: none; white-space: nowrap; display: none; }
.load-ctl { display: flex; gap: 6px; align-items: center; margin-top: 12px; }
.load-ctl select { height: 28px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; padding: 0 6px; }

/* ---------- feed ---------- */
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.chipf { height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); background: none; cursor: pointer; font-size: 11px; color: var(--muted); }
.chipf.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.feed { max-height: 560px; overflow: auto; padding: 4px 18px 14px; }
.ev { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ev:last-child { border-bottom: 0; }
.ev .ic { font-weight: 700; text-align: center; color: var(--muted); }
.ev.state .ic { color: var(--accent); }
.ev.ai .ic { color: var(--ai); }
.ev.bad .ic { color: var(--critical-ink); }
.ev.good .ic { color: var(--good-ink); }
.ev .meta { font-size: 11px; color: var(--muted); }
.ev .msg { color: var(--ink); word-break: break-word; }

/* ---------- toast ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: 420px;
         box-shadow: 0 6px 24px rgb(0 0 0 / .2); animation: in .2s ease-out; }
.toast.bad { background: var(--critical); color: #fff; }
@keyframes in { from { transform: translateY(6px); opacity: 0; } }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="brand-mark"></span>Bravo Exit Console</div>
  <span class="pill" id="planPill">계획 없음</span>
  <span class="pill" id="aiPill">AI</span>
  <span class="pill"><span class="dot" id="connDot"></span><span id="connText">연결 대기</span></span>
  <span class="spacer"></span>
  <button class="btn" id="newPlan">새 이전 계획</button>
</header>

<main class="page">
  <section class="card full">
    <div class="card-h"><h2>이전 토폴로지</h2><span class="muted" style="font-size:12px">실제 상태를 1.5초마다 조회</span></div>
    <div class="card-b" style="padding-bottom:6px">
      <svg class="topo" id="topo" viewBox="0 0 1000 300" role="img" aria-label="출발지와 목적지 사이의 쓰기 경로, 복제, 저장소 노출 상태"></svg>
    </div>
    <div class="legend">
      <span><i style="border-color:var(--accent)"></i>업무 쓰기 경로</span>
      <span><i style="border-color:var(--ai);border-top-style:dashed"></i>논리 복제 (화살표 = 흐름 방향)</span>
      <span><span class="badge b-crit">! 무인증 허용</span> 원본보다 약한 보호</span>
      <span><span class="badge b-sim">SIMULATED</span> 로컬에 없는 클라우드 구성</span>
    </div>
  </section>

  <section class="card full">
    <div class="card-h"><h2>상태 머신</h2><span class="spacer"></span><span class="muted" style="font-size:12px" id="attemptInfo"></span></div>
    <div class="card-b">
      <div class="pipe" id="pipe"></div>
      <div class="exc" id="exc"></div>
    </div>
  </section>

  <div class="stack">
    <section class="card">
      <div class="next" id="next"></div>
      <details class="more">
        <summary>수동 실행 · 데모 주입 — 순서를 벗어난 요청은 서버가 거부합니다</summary>
        <div class="more-b" id="more"></div>
      </details>
    </section>
    <section class="card">
      <div class="tabs" id="tabs"></div>
      <div class="panel" id="panel"></div>
    </section>
  </div>

  <div class="stack">
    <section class="card">
      <div class="card-h"><h2>업무 쓰기 부하</h2><span class="badge b-local">LOCAL</span><span class="spacer"></span><span id="loadState" class="badge b-neutral">중지</span></div>
      <div class="card-b">
        <div class="tiles" id="tiles"></div>
        <div class="spark-wrap">
          <svg class="spark" id="spark" viewBox="0 0 320 56" preserveAspectRatio="none" aria-label="초당 ACK 추이"></svg>
          <div class="spark-tip" id="sparkTip"></div>
        </div>
        <div class="muted" style="font-size:11px;margin-top:2px">초당 ACK · 최근 90초 (쓰기 정지 구간이 골로 보입니다)</div>
        <div class="load-ctl">
          <select id="rate" aria-label="초당 요청 수"><option>10</option><option selected>20</option><option>50</option></select>
          <span class="muted" style="font-size:12px">req/s</span>
          <span class="spacer"></span>
          <button class="btn small" id="loadStart">부하 시작</button>
          <button class="btn small" id="loadStop">중지</button>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="card-h"><h2>이벤트</h2><span class="spacer"></span><div class="filters" id="filters"></div></div>
      <div class="feed" id="feed"></div>
    </section>
  </div>
</main>

<div class="toasts" id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => n == null ? "–" : Number(n).toLocaleString("ko-KR");
const bytes = (b) => b == null ? "–" : b < 1024 ? `${b} B` : `${(b / 1024).toFixed(1)} KB`;
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString("ko-KR", { hour12: false });

let meta = null, plan = null, liveState = null, source = null, events = [];
let feedFilter = "all", activeTab = "inventory", tabPinned = false, lastState = null;
const ackHistory = []; let lastAck = null, lastAckTs = null;

/* ===================== 서버 호출 ===================== */
async function post(path, body, btn) {
  btn?.classList.add("busy");
  try {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Idempotency-Key": crypto.randomUUID() },
      body: JSON.stringify(body || {}),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) toast(`${r.status} · ${j.detail || j.error || "요청 실패"}`, true);
    return j;
  } catch (e) { toast(`요청 실패 · ${e.message}`, true); return {}; }
  finally { btn?.classList.remove("busy"); }
}
function toast(msg, bad) {
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg;
  $("toasts").append(t); setTimeout(() => t.remove(), 5000);
}

/* ===================== 상태 머신 ===================== */
const PHASES = [
  { cls: "ai", title: "준비 · AI가 제안하고 코드가 합격선을 지킴",
    steps: [["COLLECT", "설정 수집"], ["ANALYZE", "의존성 분석"], ["PROPOSE", "제안서"], ["REHEARSE", "리허설"], ["GATE", "원본 대조"]] },
  { cls: "human", title: "사람", steps: [["AWAIT_APPROVAL", "결속 승인"]] },
  { cls: "code", title: "실행 · 코드만 (LLM 미사용)",
    steps: [["SHIFT", "트래픽 전환"], ["CUTOVER", "컷오버"], ["WATCH", "감시"], ["DONE", "완료"]] },
];
const EXC = [["NEEDS_HUMAN", "AI 3회 초과"], ["SAFE_HOLD", "상태 불명 · 쓰기 닫음"], ["FAILBACK", "되돌리기"], ["DONE_ROLLED_BACK", "출발지 복귀"]];

function renderPipe() {
  const visited = new Set((plan?.history || []).flatMap(h => [h.from, h.to]));
  if (plan) visited.add("COLLECT");
  const step = ([id, label]) => `<div class="step ${plan?.state === id ? "now" : visited.has(id) ? "done" : ""}"><b>${id}</b><span>${label}</span></div>`;
  $("pipe").innerHTML = PHASES.map(p => `<div class="phase ${p.cls}"><div class="phase-h">${p.title}</div><div class="steps">${p.steps.map(step).join("")}</div></div>`).join("");

  $("attemptInfo").textContent = plan ? `AI 제안 시도 ${plan.ai_attempts}/3 · epoch ${plan.epoch}` : "";
}

function renderLoad() {
  const w = liveState?.writer;
  $("loadState").className = "badge " + (w?.running ? "b-good" : "b-neutral");
  $("loadState").textContent = w?.running ? `● 실행 ${w.rate} req/s` : "중지";
  const tile = (l, v, unit) => `<div class="tile"><div class="l">${l}</div><div class="v">${v}<small>${unit || ""}</small></div></div>`;
  $("tiles").innerHTML = w ? [
    tile("요청", fmt(w.issued)), tile("ACK", fmt(w.acked)), tile("처리 중", fmt(w.in_flight)),
    tile("재시도", fmt(w.retries)), tile("포기 (유실 후보)", fmt(w.gave_up)), tile("최대 쓰기 공백", fmt(w.max_gap_ms), "ms"),
  ].join("") : `<div class="empty" style="grid-column:1/-1">writer 응답 없음</div>`;

  const now = Date.now();
  if (w) {
    const v = lastAck != null && w.acked >= lastAck && lastAckTs ? (w.acked - lastAck) / ((now - lastAckTs) / 1000) : 0;
    ackHistory.push({ t: now, v: w.running || v ? v : 0 });
    lastAck = w.acked; lastAckTs = now;
  }
  while (ackHistory.length && now - ackHistory[0].t > 90000) ackHistory.shift();
  drawSpark();
}
function drawSpark() {
  const pts = ackHistory, svg = $("spark");
  if (pts.length < 2) { svg.innerHTML = ""; return; }
  const max = Math.max(5, ...pts.map(p => p.v)), t0 = Date.now() - 90000;
  const xy = pts.map(p => [((p.t - t0) / 90000) * 320, 52 - (p.v / max) * 46]);
  const line = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
  svg.innerHTML = `<line x1="0" y1="52" x2="320" y2="52" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <path d="${line} L${xy.at(-1)[0]},52 L${xy[0][0]},52 Z" fill="color-mix(in srgb, var(--accent) 12%, transparent)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line id="sparkX" x1="0" x2="0" y1="0" y2="56" stroke="var(--muted)" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>`;
}
$("spark").addEventListener("mousemove", (e) => {
  if (ackHistory.length < 2) return;
  const r = e.currentTarget.getBoundingClientRect(), x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const t = Date.now() - 90000 + x * 90000;
  const p = ackHistory.reduce((a, b) => Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a);
  const tip = $("sparkTip"); tip.style.display = "block"; tip.style.left = `${x * 100}%`;
  tip.textContent = `${new Date(p.t).toLocaleTimeString("ko-KR", { hour12: false })} · ${p.v.toFixed(1)} ACK/s`;
  const l = document.getElementById("sparkX"); if (l) { l.style.display = ""; l.setAttribute("x1", x * 320); l.setAttribute("x2", x * 320); }
});
$("spark").addEventListener("mouseleave", () => { $("sparkTip").style.display = "none"; const l = document.getElementById("sparkX"); if (l) l.style.display = "none"; });

function panelGate() {
  const g = plan.data.gate;
  if (!g) return `<div class="empty">아직 게이트를 실행하지 않았습니다.</div>`;
  const rows = g.questions.map(q => `<tr><td class="mono">${q.id}</td><td>${esc(q.question)}<div class="evidence">${esc(JSON.stringify(q.evidence))}</div></td>
    <td>${esc(q.source)}</td><td>${esc(q.target)}</td><td>${verdictBadge(q.verdict)}</td></tr>`).join("");
  return `<div class="verdict-row"><span class="verdict-big">${g.verdict}</span>${verdictBadge(g.verdict)}
      <span class="mono muted">${g.gate_id}</span><span class="spacer"></span><span class="muted" style="font-size:12px">LLM 미사용 · 같은 입력이면 같은 판정 · UNKNOWN은 불합격</span></div>
    <table><tr><th></th><th>질문 · 근거</th><th>원본 (AWS)</th><th>대상 (온프렘)</th><th>판정</th></tr>${rows}</table>`;
}

function panelProposal() {
  const d = plan.data, attempts = d.attempts || [], blocked = d.blocked || [];
  if (!attempts.length && !blocked.length) return `<div class="empty">게이트 BLOCK 뒤 "AI 보완 · 리허설"을 실행하면 제안서와 검증 과정이 표시됩니다.</div>`;
  let n = 0;
  const att = attempts.map(a => {
    const who = a.injected ? `<span class="badge b-sim">주입</span>` : `<span class="badge b-ai">✦ AI 시도 ${++n}</span>`;
    const p = a.proposal;
    return `<div class="attempt"><div class="attempt-h">${who}<span class="spacer"></span>${a.violations.length ? `<span class="badge b-crit">✕ 거부 · 사유를 AI에 돌려줌</span>` : `<span class="badge b-good">✓ 스키마 · 린트 통과</span>`}</div>
      <div class="mono">${esc(p.target?.type)} → <b>${esc(p.target?.name)}</b> · anonymous=${esc(p.proposal?.anonymous)} · principal=${esc(p.proposal?.principal)} · actions=[${esc((p.proposal?.actions || []).join(", "))}]</div>
      ${a.violations.length ? `<ul class="clean reason">${a.violations.map(v => `<li>${esc(v)}</li>`).join("")}</ul>` : `<div class="reason">${esc(p.rationale)}</div>`}</div>`;
  }).join("");
  const r = d.rehearsal?.checks && d.rehearsal?.applied ? d.rehearsal : null;
  const chain = r ? `<div class="sec">검증 체인</div><div class="chain">
      ${okBadge(true, "스키마")}<span class="arrow">→</span>${okBadge(true, "린트")}<span class="arrow">→</span>
      ${okBadge(r.checks.anonymous_denied, "리허설: 무인증 거부")}<span class="arrow">→</span>${okBadge(r.checks.object_intact, "리허설: 객체 보존")}<span class="arrow">→</span>
      ${okBadge(r.applied.anonymous_http === 403, `목적지 반영: ${r.applied.anonymous_http}`)}<span class="arrow">→</span>${okBadge(r.applied.app_read_ok, "앱 자격 읽기")}
      <span class="arrow">→</span>${d.gate?.verdict === "PASS" ? okBadge(true, "게이트 재대조") : `<span class="badge b-neutral">게이트 재대조 대기</span>`}</div>` : "";
  const blk = blocked.map(b => `<div class="attempt"><div class="attempt-h">${b.injected ? `<span class="badge b-sim">주입</span>` : ""}<span class="badge b-crit">⛔ 도구 계층 차단</span></div>
      <div class="mono">${esc(b.tool)} ${esc(JSON.stringify(b.args))}</div><div class="reason">${esc(b.reason)}</div></div>`).join("");
  return `<div class="sec">제안서 · 스키마 검증 → 정책 린트</div>${att}${chain}${blk ? `<div class="sec">도구 계층 차단 기록</div>${blk}` : ""}`;
}

function approvalBody() {
  const r = plan?.data.approval_request || {};
  return { approver: "operator", plan_id: r.plan_id, proposal_digest: r.proposal_digest, gate_id: r.gate_id };
}
function approve(btn) { return post(`/v1/plans/${plan.id}/approvals`, approvalBody(), btn); }

function panelApproval() {
  const r = plan.data.approval_request, a = plan.data.approval;
  if (!r) return `<div class="empty">게이트가 PASS하면 승인 요청이 만들어집니다.</div>`;
  const s = r.summary, li = (xs) => xs.map(x => `<li>${esc(x)}</li>`).join("");
  return `${s ? `<div class="sec"><span class="badge b-ai">✦ AI 요약</span> 사람 확인용 · 승인 여부는 권하지 않음</div>
      <div>${esc(s.summary)}</div>
      <div class="two" style="margin-top:4px"><div><div class="sec">변경</div><ul class="clean">${li(s.changes)}</ul></div>
        <div><div class="sec">위험</div><ul class="clean">${li(s.risks)}</ul></div></div>`
      : `<div class="empty">AI 요약 없음 (승인은 결속 값만으로 가능)</div>`}
    <div class="sec">결속 값 · 코드가 표시하고 검증</div>
    <div class="bind"><dl class="kv"><dt>plan</dt><dd class="mono">${esc(r.plan_id)}</dd><dt>제안서 digest</dt><dd class="mono">${esc(r.proposal_digest)}</dd>
      <dt>게이트</dt><dd class="mono">${esc(r.gate_id)}</dd><dt>만료</dt><dd class="mono">${clock(r.expires_at)}</dd></dl></div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap">
      ${a ? `<span class="badge b-good">✓ 승인됨</span><span class="muted">${esc(a.approver)} · ${clock(a.approved_at)}</span>`
          : plan.state === "AWAIT_APPROVAL" ? `<button class="btn primary" id="approveBtn">위 결속 값으로 승인</button><span class="muted" style="font-size:12px">제안서나 게이트 결과가 바뀌면 이 승인은 거부됩니다.</span>` : ""}
    </div>`;
}

function execView(r, title) {
  const steps = r.steps.map(s => `<tr><td class="mono">${s.no}</td><td>${esc(s.name)}</td>
    <td>${s.ok ? '<span class="badge b-good">✓</span>' : '<span class="badge b-crit">✕</span>'}</td>
    <td class="mono" style="text-align:right">${s.ms}ms</td><td class="evidence">${esc(JSON.stringify(s.detail))}</td></tr>`).join("");
  const rc = r.receipt;
  const rcRows = rc ? Object.keys(rc.from).map(tb => {
    const a = rc.from[tb], b = rc.to[tb], same = JSON.stringify(a) === JSON.stringify(b);
    return `<tr><td class="mono">${tb}</td><td class="mono">${fmt(a.rows)} / ${fmt(b.rows)}</td><td class="mono">${a.pk_hash}<br>${b.pk_hash}</td>
      <td class="mono">${a.content_hash}<br>${b.content_hash}</td><td>${same ? '<span class="badge b-good">✓ MATCH</span>' : '<span class="badge b-crit">✕ MISMATCH</span>'}</td></tr>`;
  }).join("") : "";
  const seqs = rc ? Object.entries(rc.sequences).map(([n, s]) => `${n}: ${fmt(s.to_before)} → <b>${fmt(s.to_set)}</b>`).join(" · ") : "";
  const rec = r.reconcile;
  const outcomeCls = r.outcome === "COMMITTED" ? "b-good" : r.outcome === "ABORT_PRE_WRITE" ? "b-warn" : "b-crit";
  return `<div class="sec">${title}</div>
    <div class="verdict-row"><span class="badge ${outcomeCls}">${r.outcome}</span><span class="mono">${esc(r.from)} → ${esc(r.to)} · epoch ${r.epoch}</span><span class="spacer"></span>
      ${r.write_pause_ms != null ? `<span class="muted" style="font-size:12px">쓰기 정지</span><span class="verdict-big">${fmt(r.write_pause_ms)}<small style="font-size:12px;font-weight:500"> ms</small></span><span class="badge b-local">LOCAL</span>` : ""}</div>
    <table><tr><th>#</th><th>단계</th><th></th><th style="text-align:right">시간</th><th>근거</th></tr>${steps}</table>
    ${rc ? `<div class="sec">무결성 영수증 (원본 / 대상)</div><table><tr><th>테이블</th><th>행</th><th>PK 해시</th><th>내용 해시</th><th></th></tr>${rcRows}</table>
      <div class="reason">시퀀스 보정(올리기만): ${seqs}</div>` : ""}
    ${rec ? `<div class="sec">writer 대조 · ${esc(rec.checked_in)}</div><div class="chain">
      <span class="badge b-neutral">ACK ${fmt(rec.acked)}</span><span class="badge b-neutral">DB 확인 ${fmt(rec.found)}</span>
      ${okBadge(rec.lost === 0, `유실 ${rec.lost}`)}${okBadge(rec.duplicated === 0, `중복 ${rec.duplicated}`)}</div>` : ""}`;
}

function panelCutover() {
  const d = plan.data;
  if (!d.shift && !d.cutover && !d.failback) return `<div class="empty">승인 뒤 SHIFT · 컷오버 결과가 표시됩니다.</div>`;
  return `${d.shift ? `<div class="sec">트래픽 전환 <span class="badge b-sim">SIMULATED</span></div><div>Edge 가중치 온프렘 ${d.shift.weight}%</div>` : ""}
    ${d.cutover?.steps ? execView(d.cutover, "컷오버 · Executor 8단계 (LLM 미사용)") : ""}
    ${d.failback?.steps ? execView(d.failback, "되돌리기 · 같은 순서를 반대 방향으로") : d.failback ? `<div class="sec">되돌리기</div><pre class="mono">${esc(JSON.stringify(d.failback, null, 2))}</pre>` : ""}`;
}

/* ===================== 이벤트 ===================== */
const FILTERS = [["all", "전체"], ["state", "상태"], ["ai", "AI"], ["bad", "차단 · 오류"]];
function evKind(e) {
  if (e.type === "state_changed" || e.type === "plan_created") return ["state", "→"];
  if (["transition_rejected", "tool_blocked", "error", "ai_error"].includes(e.type) || e.data?.ok === false) return ["bad", "✕"];
  if (e.type.startsWith("ai_") || e.type === "proposal_checked") return ["ai", "✦"];
  if (e.type === "gate_result") return [e.data?.verdict === "PASS" ? "good" : "bad", "="];
  if (e.type === "approved") return ["good", "✓"];
  return ["", "·"];
}
function renderFilters() {
  $("filters").innerHTML = FILTERS.map(([k, l]) => `<button class="chipf ${k === feedFilter ? "on" : ""}" data-k="${k}">${l}</button>`).join("");
  $("filters").querySelectorAll(".chipf").forEach(b => b.onclick = () => { feedFilter = b.dataset.k; renderFilters(); renderFeed(); });
}
function renderFeed() {
  const rows = events.slice().reverse().filter(e => feedFilter === "all" || evKind(e)[0] === feedFilter);
  $("feed").innerHTML = rows.length ? rows.map(e => {
    const [k, ic] = evKind(e);
    const tags = (e.data?.stub ? `<span class="badge b-neutral">STUB</span> ` : "") + (e.data?.simulated ? `<span class="badge b-sim">SIMULATED</span> ` : "") + (e.data?.injected ? `<span class="badge b-sim">주입</span> ` : "");
    return `<div class="ev ${k}"><div class="ic">${ic}</div><div><div class="meta">${clock(e.ts)} · #${e.id} · ${esc(e.type)}</div><div class="msg">${tags}${esc(e.message)}</div></div></div>`;
  }).join("") : `<div class="empty">이벤트 없음</div>`;
}

/* ===================== 데이터 흐름 ===================== */
function renderAll() {
  const bad = ["SAFE_HOLD", "NEEDS_HUMAN", "FAILBACK"].includes(plan?.state);
  $("planPill").innerHTML = plan ? `<span class="mono">${plan.id}</span><span class="badge ${bad ? "b-crit" : "b-neutral"}">${plan.state}</span>` : "계획 없음";
  renderPipe(); renderNext(); renderMore(); renderTabs(); renderTopo();
}
let planTimer = null;
function loadPlan(id) {
  clearTimeout(planTimer);
  planTimer = setTimeout(async () => { plan = await (await fetch(`/v1/plans/${id}`)).json(); renderAll(); }, 60);
}
function subscribe(id) {
  source?.close(); events = []; renderFeed();
  source = new EventSource(`/v1/plans/${id}/events`);
  source.onopen = () => { $("connDot").className = "dot on"; $("connText").textContent = "실시간 연결"; };
  source.onerror = () => { $("connDot").className = "dot"; $("connText").textContent = "재연결 중"; };
  source.onmessage = (m) => { events.push(JSON.parse(m.data)); renderFeed(); loadPlan(id); };
}
async function newPlan(btn) {
  const p = await post("/v1/plans", {}, btn);
  if (p.id) { lastState = null; tabPinned = false; subscribe(p.id); loadPlan(p.id); }
}
async function pollLive() {
  try { liveState = await (await fetch("/v1/live")).json(); } catch { liveState = null; }
  renderTopo(); renderLoad();
}

$("newPlan").onclick = (e) => newPlan(e.currentTarget);
$("loadStart").onclick = (e) => post("/v1/load/start", { rate: Number($("rate").value) }, e.currentTarget).then(pollLive);
$("loadStop").onclick = (e) => post("/v1/load/stop", {}, e.currentTarget).then(pollLive);

(async () => {
  meta = await (await fetch("/v1/meta")).json();
  $("aiPill").innerHTML = `<span class="badge ${meta.ai_mode === "live" ? "b-ai" : "b-sim"}">AI ${meta.ai_mode}</span><span class="mono">${meta.model}</span>`;
  renderFilters(); renderAll(); renderLoad();
  if (meta.current_plan_id) { subscribe(meta.current_plan_id); loadPlan(meta.current_plan_id); }
  pollLive(); setInterval(pollLive, 1500);
})();
</script>
</body>
