<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bravo Exit Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2f6fde; --ok: #1a8a4a; --bad: #c8372d; --warn: #b7791f; --sim: #7c5cc4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #9aa3af; --line: #2c323d;
            --accent: #6b9cf0; --ok: #4cc17f; --bad: #ef6a5f; --warn: #e2a53f; --sim: #a88ef0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .plan { color: var(--muted); font-family: ui-monospace, monospace; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .rail { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px;
          color: var(--muted); font-family: ui-monospace, monospace; }
  .chip.done { color: var(--text); border-color: var(--muted); }
  .chip.now { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.exc.now { background: var(--bad); border-color: var(--bad); }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .actions .group { font-size: 12px; color: var(--muted); margin-top: 8px; }
  button { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; text-align: left; }
  button:hover { border-color: var(--accent); }
  button.next { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  button.danger { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
           font-weight: 600; margin-right: 4px; vertical-align: 1px; }
  .b-stub { background: var(--line); color: var(--muted); }
  .b-sim { background: color-mix(in srgb, var(--sim) 18%, transparent); color: var(--sim); }
  .b-ai { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .b-local { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .b-pass { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .b-block { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 360px; overflow: auto; }
  .log div { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log .t { color: var(--muted); margin-right: 6px; }
  .log .state_changed { color: var(--accent); }
  .log .transition_rejected, .log .error { color: var(--bad); }
  pre { margin: 0; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 360px; overflow: auto; }
  .placeholder { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .verdict { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Bravo Exit Console</h1>
  <span class="plan" id="planId">계획 없음</span>
  <span class="plan" id="aiMode"></span>
  <span class="spacer"></span>
  <button id="newPlan">새 이전 계획</button>
</header>

<main>
  <section class="col">
    <div class="card">
      <h2>실행</h2>
      <div class="actions" id="actions"></div>
    </div>
  </section>

  <section class="col">
    <div class="card">
      <h2>상태 머신</h2>
      <div class="rail" id="flow"></div>
      <div class="rail" id="exceptions"></div>
    </div>

    <div class="grid">
      <div class="card"><h2>출발지 수집 · 의존성</h2><div id="inventory" class="placeholder">계획을 만들면 표시</div></div>
      <div class="card"><h2>원본 대조 게이트</h2><div id="gate" class="placeholder">게이트 실행 전</div></div>
      <div class="card"><h2>AI 제안서 · 검증</h2><div id="proposal" class="placeholder">게이트 BLOCK 뒤 "AI 보완 · 리허설"</div></div>
      <div class="card"><h2>승인</h2><div id="approval" class="placeholder">게이트 PASS 뒤 표시</div></div>
      <div class="card"><h2>컷오버 · 영수증</h2><div id="cutover" class="placeholder">5단계에서 연결</div></div>
      <div class="card"><h2>단계 결과 (원본 데이터)</h2><pre id="data"></pre></div>
    </div>

    <div class="card">
      <h2>이벤트</h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const ACTIONS = [
  { group: "S1 · S2" },
  { id: "gate", label: "원본 대조 게이트 실행", path: "gate" },
  { id: "rehearsals", label: "AI 보완 · 리허설", path: "rehearsals" },
  { id: "approvals", label: "승인 (결속 값 포함)", path: "approvals", body: () => approvalBody() },
  { group: "S3" },
  { id: "shift", label: "트래픽 전환 (SHIFT)", path: "shift" },
  { id: "cutover", label: "컷오버", path: "cutover" },
  { id: "complete", label: "관찰 종료 (DONE)", path: "complete" },
  { group: "S4 · 데모 주입" },
  { id: "fault", label: "목적지 장애 주입", path: "faults", body: { kind: "target_failure" }, danger: true },
  { id: "tool", label: "파괴적 명령 주입", path: "faults", body: { kind: "destructive_tool" }, danger: true },
  { id: "badProposal", label: "잘못된 제안서 주입", path: "faults", body: { kind: "invalid_proposal" }, danger: true },
  { id: "failback", label: "수동 되돌리기", path: "failback", danger: true },
];

let meta = null, plan = null, source = null;

function nextAction(p) {
  if (!p) return null;
  const gate = p.data.gate;
  switch (p.state) {
    case "REHEARSE": return "gate";
    case "GATE": return gate && gate.verdict === "BLOCK" ? "rehearsals" : null;
    case "AWAIT_APPROVAL": return p.data.approval ? "shift" : "approvals";
    case "SHIFT": return "cutover";
    case "WATCH": return "complete";
    default: return null;
  }
}

function renderActions() {
  const box = $("actions"); box.innerHTML = "";
  const next = nextAction(plan);
  for (const a of ACTIONS) {
    if (a.group) { const g = document.createElement("div"); g.className = "group"; g.textContent = a.group; box.append(g); continue; }
    const b = document.createElement("button");
    b.textContent = a.label;
    if (a.id === next) b.classList.add("next");
    if (a.danger) b.classList.add("danger");
    b.disabled = !plan;
    b.onclick = () => post(`/v1/plans/${plan.id}/${a.path}`, typeof a.body === "function" ? a.body() : (a.body || {}));
    box.append(b);
  }
}

function renderRail() {
  const visited = new Set((plan?.history || []).flatMap(h => [h.from, h.to]));
  const fill = (el, states, exc) => {
    el.innerHTML = "";
    for (const s of states) {
      const c = document.createElement("span");
      c.className = "chip" + (exc ? " exc" : "") + (visited.has(s) ? " done" : "") + (plan?.state === s ? " now" : "");
      c.textContent = s; el.append(c);
    }
  };
  fill($("flow"), meta.flow, false);
  fill($("exceptions"), meta.exceptions, true);
}

function render() {
  $("planId").textContent = plan ? `${plan.id} · ${plan.state}` : "계획 없음";
  renderRail(); renderActions();
  $("data").textContent = plan ? JSON.stringify(plan.data, null, 2) : "";
  renderInventory(); renderGate(); renderProposal(); renderApproval();
}

function approvalBody() {
  const r = plan?.data.approval_request || {};
  return { approver: "operator", plan_id: r.plan_id, proposal_digest: r.proposal_digest, gate_id: r.gate_id };
}

const okMark = (v) => v ? '<span class="badge b-pass">OK</span>' : '<span class="badge b-block">FAIL</span>';

function renderProposal() {
  const d = plan?.data || {}, el = $("proposal");
  const attempts = d.attempts || [], blocked = d.blocked || [];
  if (!attempts.length && !blocked.length) { el.className = "placeholder"; el.textContent = '게이트 BLOCK 뒤 "AI 보완 · 리허설"'; return; }
  el.className = "";
  const rows = attempts.map((a, i) => `<tr><td>${a.injected ? '<span class="badge b-sim">주입</span>' : "AI #" + (i + 1)}</td>
    <td class="mono">${escape(JSON.stringify(a.proposal.proposal))}<br>target=${escape(a.proposal.target.name)}</td>
    <td>${a.violations.length ? '<span class="badge b-block">거부</span>' + a.violations.map(escape).join("<br>") : '<span class="badge b-pass">통과</span>'}</td></tr>`).join("");
  const r = d.rehearsal && d.rehearsal.checks && d.rehearsal.applied ? d.rehearsal : null;
  const reh = r ? `<div class="sub">리허설 버킷 검증</div>
      <div>무인증 거부 ${okMark(r.checks.anonymous_denied)} 객체 보존 ${okMark(r.checks.object_intact)}</div>
      <div class="sub">목적지 반영</div>
      <div>무인증 HTTP <span class="mono">${r.applied.anonymous_http}</span> · 앱 자격 읽기 ${okMark(r.applied.app_read_ok)}</div>` : "";
  const blk = blocked.map(b => `<div class="mono">${b.injected ? '<span class="badge b-sim">주입</span>' : ""}<span class="badge b-block">차단</span>${escape(b.tool)} ${escape(JSON.stringify(b.args))}<br>${escape(b.reason)}</div>`).join("");
  const p = attempts.filter(a => !a.violations.length && !a.injected).pop();
  el.innerHTML = `<div class="sub">제안서 검증 (스키마 → 린트)</div>
    <table><tr><th></th><th>제안</th><th>결과</th></tr>${rows}</table>
    ${p ? `<div class="sub">채택 제안 근거 (risk: ${p.proposal.risk})</div><div>${escape(p.proposal.rationale)}</div>` : ""}
    ${reh}${blk ? '<div class="sub">도구 계층 차단 기록</div>' + blk : ""}`;
}

function renderApproval() {
  const r = plan?.data.approval_request, a = plan?.data.approval, el = $("approval");
  if (!r) { el.className = "placeholder"; el.textContent = "게이트 PASS 뒤 표시"; return; }
  el.className = "";
  const s = r.summary;
  const list = (xs) => xs.map(x => `<li>${escape(x)}</li>`).join("");
  const exp = new Date(r.expires_at * 1000).toLocaleTimeString("ko-KR", { hour12: false });
  el.innerHTML = `
    ${s ? `<div class="sub">AI 요약 (사람 확인용)</div><div>${escape(s.summary)}</div>
      <div class="sub">변경</div><ul>${list(s.changes)}</ul><div class="sub">위험</div><ul>${list(s.risks)}</ul>`
        : '<div class="placeholder">AI 요약 없음</div>'}
    <div class="sub">결속 값 (코드가 표시 · 검증)</div>
    <div class="mono">plan ${r.plan_id} · proposal ${r.proposal_digest} · gate ${r.gate_id} · 만료 ${exp}</div>
    <div class="sub">상태</div>
    <div>${a ? `<span class="badge b-pass">승인됨</span>${escape(a.approver)}` : "승인 대기"}</div>`;
}

const badge = (v) => `<span class="badge ${v === "PASS" ? "b-pass" : "b-block"}">${v}</span>`;

function renderInventory() {
  const c = plan?.data.collect, a = plan?.data.analyze, el = $("inventory");
  if (!c) { el.className = "placeholder"; el.textContent = "계획을 만들면 표시"; return; }
  el.className = "";
  const ids = Object.entries(c.identities).map(([k, v]) => `<div class="mono">${k}: ${v.join(", ")}</div>`).join("");
  const sim = c.simulated_inventory.map(i => `${i.kind} <span class="mono">${i.id}</span>`).join(" · ");
  const deps = (a?.dependencies || []).map(d => {
    const by = d.classified_by === "ai" ? `<span class="badge b-ai">AI · ${d.confidence}</span>`
             : d.classified_by === "none" ? '<span class="badge b-block">사람 확인</span>' : "";
    const why = d.reason ? `<div class="placeholder">${escape(d.reason)}</div>` : "";
    return `<tr><td>${by}${d.grade}</td><td class="mono">${d.file}:${d.line}</td><td>${escape(d.desc)}${why}</td></tr>`;
  }).join("");
  el.innerHTML = `
    <div class="sub">출발지 버킷 <span class="mono">${c.bucket}</span> 접근 주체</div>${ids}
    <div class="sub">출발지 DB: messages ${c.messages_rows}행 · 스키마 <span class="mono">${c.schema_hash.slice(0, 8)}</span></div>
    <div class="sub"><span class="badge b-sim">SIMULATED</span>${sim}</div>
    <div class="sub">의존성 (정적 탐지)</div>
    <table><tr><th>등급</th><th>위치</th><th>내용</th></tr>${deps}</table>`;
}

function renderGate() {
  const g = plan?.data.gate, el = $("gate");
  if (!g) { el.className = "placeholder"; el.textContent = "게이트 실행 전"; return; }
  el.className = "";
  const rows = g.questions.map(q => `<tr><td class="mono">${q.id}</td><td>${escape(q.question)}</td>
    <td>${escape(q.source)}</td><td>${escape(q.target)}</td><td>${badge(q.verdict)}</td></tr>`).join("");
  el.innerHTML = `<div class="verdict">${badge(g.verdict)} <span class="mono">${g.gate_id}</span></div>
    <table><tr><th></th><th>질문</th><th>원본 (AWS)</th><th>대상 (온프렘)</th><th>판정</th></tr>${rows}</table>`;
}

function log(e) {
  const d = document.createElement("div");
  d.className = e.type;
  const t = new Date(e.ts * 1000).toLocaleTimeString("ko-KR", { hour12: false });
  const badges = (e.data?.stub ? '<span class="badge b-stub">STUB</span>' : "")
               + (e.data?.simulated ? '<span class="badge b-sim">SIMULATED</span>' : "");
  d.innerHTML = `<span class="t">${t} #${e.id ?? "-"}</span>${badges}<b>${e.type}</b> ${escape(e.message || "")}`;
  $("log").prepend(d);
}
const escape = (s) => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function loadPlan(id) {
  plan = await (await fetch(`/v1/plans/${id}`)).json();
  render();
}

function subscribe(id) {
  if (source) source.close();
  $("log").innerHTML = "";
  source = new EventSource(`/v1/plans/${id}/events`);
  source.onmessage = (m) => { log(JSON.parse(m.data)); loadPlan(id); };
}

async function post(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Idempotency-Key": crypto.randomUUID() },
    body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok) log({ type: "error", ts: Date.now() / 1000, message: `${r.status} ${j.detail || j.error}` });
  return j;
}

$("newPlan").onclick = async () => {
  if (source) source.close();
  const p = await post("/v1/plans", {});
  if (p.id) { subscribe(p.id); await loadPlan(p.id); }
};

(async () => {
  meta = await (await fetch("/v1/meta")).json();
  $("aiMode").textContent = `AI ${meta.ai_mode} · ${meta.model}`;
  if (meta.current_plan_id) { subscribe(meta.current_plan_id); await loadPlan(meta.current_plan_id); }
  else render();
})();
</script>
</body>
</html>
