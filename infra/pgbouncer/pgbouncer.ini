; 앱의 유일한 DB 진입점. 대상 DB는 공유 볼륨의 databases.ini가 정한다.
; 컷오버 때 플랫폼이 databases.ini를 바꾸고 PAUSE → RELOAD → RESUME 한다.
[databases]
%include /etc/pgbouncer/target/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
